<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 목록</title>
  <!-- Tailwind CSS 불러오기 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-start justify-center p-4 pt-12">

  <!-- 카드 전체를 감싸는 상자 -->
  <div class="bg-white rounded-2xl shadow-lg p-6 w-full max-w-md">

    <h1 class="text-2xl font-bold text-slate-700 mb-4">할 일 목록</h1>

    <!-- 입력 필드와 추가 버튼을 한 줄에 배치 -->
    <form id="todo-form" class="flex gap-2 mb-6">
      <input
        id="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        class="flex-1 border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
      />
      <button
        type="submit"
        class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition"
      >
        추가
      </button>
    </form>

    <!-- 할 일 항목들이 여기에 하나씩 추가됩니다 -->
    <ul id="todo-list" class="space-y-2"></ul>

    <!-- 할 일이 하나도 없을 때 보여 줄 안내 문구 -->
    <p id="empty-message" class="text-center text-slate-400 py-6">할 일이 없습니다. 새로 추가해 보세요!</p>

  </div>

  <script>
    // 1. 할 일들을 담아 둘 배열 (메모장 역할)
    //    각 할 일은 { id, text, done } 형태의 객체로 저장합니다.
    let todos = [];

    // 2. 다음에 만들 할 일에 붙일 고유 번호
    let nextId = 1;

    // 3. HTML 요소들을 찾아 변수에 담아 둡니다
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyMessage = document.getElementById('empty-message');

    // 4. 화면을 다시 그리는 함수 (메모장 내용을 화면에 옮겨 적기)
    function render() {
      // 먼저 기존 목록을 모두 지웁니다
      list.innerHTML = '';

      // 할 일이 없으면 안내 문구를 보여 주고, 있으면 숨깁니다
      emptyMessage.classList.toggle('hidden', todos.length > 0);

      // 할 일을 하나씩 꺼내서 화면에 li(목록 한 줄)를 만듭니다
      todos.forEach((todo) => {
        const li = document.createElement('li');
        li.className = 'flex items-center gap-3 border border-slate-200 rounded-lg px-3 py-2';

        // 체크박스
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.className = 'w-5 h-5 accent-blue-500 cursor-pointer';
        // 체크 상태가 바뀌면 done 값을 바꾸고 다시 그립니다
        checkbox.addEventListener('change', () => {
          todo.done = checkbox.checked;
          render();
        });

        // 할 일 내용 (완료되면 줄이 그어지고 회색이 됩니다)
        const span = document.createElement('span');
        span.textContent = todo.text;   // textContent를 쓰면 입력한 내용이 글자 그대로 표시됩니다
        span.className = 'flex-1 break-all ' + (todo.done ? 'line-through text-slate-400' : 'text-slate-700');

        // 삭제 버튼
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '삭제';
        deleteBtn.className = 'text-sm bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 py-1 rounded-md transition';
        deleteBtn.addEventListener('click', () => {
          // 이 id를 가진 할 일만 빼고 새 배열을 만듭니다
          todos = todos.filter((item) => item.id !== todo.id);
          render();
        });

        // 만든 요소들을 li 안에 차례로 넣고, li를 목록(ul)에 넣습니다
        li.append(checkbox, span, deleteBtn);
        list.appendChild(li);
      });
    }

    // 5. 폼을 제출(추가 버튼 클릭 또는 Enter 키)했을 때 실행
    form.addEventListener('submit', (event) => {
      event.preventDefault();          // 페이지가 새로고침되는 기본 동작을 막습니다

      const text = input.value.trim(); // 앞뒤 공백을 제거합니다
      if (text === '') return;         // 빈 내용이면 아무것도 하지 않습니다

      // 새 할 일을 배열에 추가합니다
      todos.push({ id: nextId, text: text, done: false });
      nextId += 1;

      input.value = '';                // 입력창 비우기
      input.focus();                   // 입력창에 다시 커서 두기
      render();
    });

    // 6. 처음 화면을 그립니다
    render();
  </script>

</body>
</html>
