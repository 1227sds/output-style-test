<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 지정 -->
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 화면 크기에 맞게 보이도록 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카운터 앱</title>
  <!-- Tailwind CSS 불러오기 (클래스 이름만으로 디자인을 입힐 수 있음) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <!-- 카운터 카드 전체를 감싸는 상자 -->
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm text-center">

    <h1 class="text-2xl font-bold text-slate-700 mb-6">카운터</h1>

    <!-- 현재 카운트를 보여주는 숫자 (자바스크립트가 이 글자를 바꿉니다) -->
    <p id="count" class="text-7xl font-extrabold text-blue-600 mb-8">0</p>

    <!-- 버튼 3개를 한 줄에 나란히 배치 (grid-cols-3 = 세 칸) -->
    <div class="grid grid-cols-3 gap-3">
      <button id="decrement-btn"
        class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        -1
      </button>
      <button id="reset-btn"
        class="bg-blue-300 hover:bg-blue-400 active:bg-blue-500 text-blue-900 font-semibold py-3 rounded-lg transition">
        리셋
      </button>
      <button id="increment-btn"
        class="bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
        +1
      </button>
    </div>

  </div>

  <script>
    // 1. 현재 카운트 값을 저장하는 변수 (처음엔 0)
    let count = 0;

    // 2. HTML에서 필요한 요소들을 id로 찾아서 변수에 담아 둡니다
    const countEl = document.getElementById('count');
    const incrementBtn = document.getElementById('increment-btn');
    const decrementBtn = document.getElementById('decrement-btn');
    const resetBtn = document.getElementById('reset-btn');

    // 3. 변수의 값을 화면의 숫자에 반영하는 함수
    function render() {
      countEl.textContent = count;
    }

    // 4. 각 버튼이 클릭되었을 때 실행될 동작 연결
    incrementBtn.addEventListener('click', () => {
      count += 1;   // 1 증가
      render();     // 화면 갱신
    });

    decrementBtn.addEventListener('click', () => {
      count -= 1;   // 1 감소
      render();
    });

    resetBtn.addEventListener('click', () => {
      count = 0;    // 0으로 초기화
      render();
    });
  </script>

</body>
</html>
